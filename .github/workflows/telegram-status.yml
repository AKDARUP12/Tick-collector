name: Telegram Status Poller (24/7)

on:
  schedule:
    - cron: '*/5 * * * *'  # every 5m
  workflow_dispatch:

concurrency:
  group: telegram-status
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: .telegram_offset
          key: telegram-offset-v1-${{ github.run_id }}
          restore-keys: |
            telegram-offset-v1-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Poll and reply /status
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          pip install -q requests
          python tools/telegram_poller.py
      - name: Save offset
        if: always()
        run: cat .telegram_offset || echo "no offset"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .telegram_offset
          key: telegram-offset-v1-${{ github.run_id }}
          enableCrossOsArchive: false
