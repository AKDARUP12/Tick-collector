name: Collect Morning (09:15-15:00 IST)

# Public repo = unlimited free minutes, but job max is 6h (360 min).
# Morning session 09:15-15:00 = 5h45m = 345 min -> fits safely.
# Closing 40m is separate workflow collect-closing.yml

"on":
  schedule:
    - cron: '45 3 * * 1-5'  # 09:15 IST = 03:45 UTC, Mon-Fri
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no live broker)'
        required: false
        default: 'false'

concurrency:
  group: market-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # < 360 hard limit, covers 09:15-15:00 + startup
    permissions:
      contents: write  # needed only if you enable auto-commit of data

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collector 09:15-15:00 IST
        if: ${{ inputs.dry_run != 'true' }}
        env:
          ARROW_APP_ID: ${{ secrets.ARROW_APP_ID }}
          ARROW_APP_SECRET: ${{ secrets.ARROW_APP_SECRET }}
          ARROW_TOTP_SECRET: ${{ secrets.ARROW_TOTP_SECRET }}
          ARROW_USER_ID: ${{ secrets.ARROW_USER_ID }}
          ARROW_PASSWORD: ${{ secrets.ARROW_PASSWORD }}
          ARROW_STRIKES: ${{ secrets.ARROW_STRIKES }}
          ARROW_MODE: ${{ secrets.ARROW_MODE }}
          ARROW_USE_HFT: ${{ secrets.ARROW_USE_HFT }}
          TZ: Asia/Kolkata
        run: |
          echo "Starting morning session until 15:00 IST (now=$(TZ=Asia/Kolkata date))"
          # --until handles graceful flush/close at 15:00 IST even if cron was delayed
          python run_collect.py --until 15:00

      - name: Dry run
        if: ${{ inputs.dry_run == 'true' }}
        run: python run_collect.py --dry-run

      - name: Build 1-min bars (if any ticks)
        if: always()
        run: |
          DATE=$(TZ=Asia/Kolkata date +%F)
          if [ -d "data/live/ticks/date=$DATE" ]; then
            python tools/build_minute.py --date $DATE || true
          else
            echo "No tick dir for $DATE, skipping build_minute"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ticks-morning-${{ env.DATE || github.run_id }}
          path: |
            data/live/ticks/
            data/live/minute/
          if-no-files-found: warn
          retention-days: 14

      - name: Send zip to Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DATE=$(TZ=Asia/Kolkata date +%F)
          if [ ! -d "data/live/ticks/date=$DATE" ]; then echo "No ticks for $DATE, skip telegram"; exit 0; fi
          ZIP="ticks-$DATE.zip"
          echo "Zipping data/live/ticks/date=$DATE + data/live/minute -> $ZIP"
          zip -r -9 "$ZIP" "data/live/ticks/date=$DATE" data/live/minute 2>&1 | tail -20
          ls -lh "$ZIP"
          # Telegram Bot API limit 50MB per document -> split if needed
          MAX=45M
          if [ $(stat -c%s "$ZIP") -gt 47185920 ]; then
            echo "Zip >50MB, splitting into 45MB chunks..."
            split -b $MAX "$ZIP" "${ZIP}.part-"
            for p in ${ZIP}.part-*; do
              echo "Sending $p..."
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
                -F chat_id="${TELEGRAM_CHAT_ID}" \
                -F document=@"$p" \
                -F caption="Ticks $DATE part $(basename $p) - morning" | tail -c 500
              sleep 1
            done
          else
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TELEGRAM_CHAT_ID}" \
              -F document=@"$ZIP" \
              -F caption="Ticks $DATE - morning $(TZ=Asia/Kolkata date +%H:%M IST)" | tail -c 500
          fi

      # --- Optional: commit data back to repo (uncomment to enable) ---
      # Data is ephemeral on runner - this persists it in the public repo.
      # If you enable this, be sure data/ is NOT gitignored for parquet,
      # or push to a dedicated branch.
      # - name: Commit data
      #   if: always()
      #   run: |
      #     git config user.name "github-actions[bot]"
      #     git config user.email "github-actions[bot]@users.noreply.github.com"
      #     git add -f data/live/ticks/ data/live/minute/ || true
      #     git diff --cached --quiet || git commit -m "data: morning $(TZ=Asia/Kolkata date +%F\ %H:%M IST) [skip ci]"
      #     git push || echo "push failed (no changes or protected branch)"
