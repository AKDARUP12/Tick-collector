name: Collect Closing (15:00-15:40 IST)

# Second split to stay under 6h limit.
# 15:00-15:40 IST = 40 min (09:30-10:10 UTC)

on:
  schedule:
    - cron: '25 9 * * 1-5'  # 14:55 IST = 09:25 UTC, Mon-Fri (5m early, overlaps 14:55-15:00)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no live broker)'
        required: false
        default: 'false'

concurrency:
  group: market-collect-closing
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # 40 + 5 buffer
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collector 15:00-15:40 IST
        if: ${{ inputs.dry_run != 'true' }}
        env:
          ARROW_APP_ID: ${{ secrets.ARROW_APP_ID }}
          ARROW_APP_SECRET: ${{ secrets.ARROW_APP_SECRET }}
          ARROW_TOTP_SECRET: ${{ secrets.ARROW_TOTP_SECRET }}
          ARROW_USER_ID: ${{ secrets.ARROW_USER_ID }}
          ARROW_PASSWORD: ${{ secrets.ARROW_PASSWORD }}
          ARROW_STRIKES: ${{ secrets.ARROW_STRIKES }}
          ARROW_MODE: ${{ secrets.ARROW_MODE }}
          ARROW_USE_HFT: ${{ secrets.ARROW_USE_HFT }}
          TZ: Asia/Kolkata
        run: |
          echo "Starting closing session until 15:40 IST (now=$(TZ=Asia/Kolkata date))"
          python run_collect.py --until 15:40

      - name: Dry run
        if: ${{ inputs.dry_run == 'true' }}
        run: python run_collect.py --dry-run

      # - uses: actions/upload-artifact@v4  # disabled: keep only Telegram 15m zips
      #   if: always()
      #   with:
      #     name: ticks-closing-${{ env.DATE || github.run_id }}
      #     path: |
      #       data/live/ticks/
      #       if-no-files-found: warn
      #       retention-days: 14

      - name: Send zip to Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then echo "telegram secrets not set, skip"; exit 0; fi
          DATE=$(TZ=Asia/Kolkata date +%F)
          if [ ! -d "data/live/ticks/date=$DATE" ]; then echo "No ticks for $DATE, skip telegram"; exit 0; fi
          ZIP="ticks-$DATE-closing.zip"
          echo "Zipping data/live/ticks/date=$DATE -> $ZIP"
          zip -r -9 "$ZIP" "data/live/ticks/date=$DATE" 2>&1 | tail -20
          ls -lh "$ZIP"
          MAX=45M
          if [ $(stat -c%s "$ZIP") -gt 47185920 ]; then
            echo "Zip >50MB, splitting..."
            split -b $MAX "$ZIP" "${ZIP}.part-"
            for p in ${ZIP}.part-*; do
              echo "Sending $p..."
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
                -F chat_id="${TELEGRAM_CHAT_ID}" \
                -F document=@"$p" \
                -F caption="Ticks $DATE part $(basename $p) - closing" | tail -c 500
              sleep 1
            done
          else
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TELEGRAM_CHAT_ID}" \
              -F document=@"$ZIP" \
              -F caption="Ticks $DATE - closing $(TZ=Asia/Kolkata date +%H:%M IST)" | tail -c 500
          fi

      # - name: Commit data
      #   if: always()
      #   run: |
      #     git config user.name "github-actions[bot]"
      #     git config user.email "github-actions[bot]@users.noreply.github.com"
      #     git add -f data/live/ticks/ data/live/minute/ || true
      #     git diff --cached --quiet || git commit -m "data: closing $(TZ=Asia/Kolkata date +%F\ %H:%M IST) [skip ci]"
      #     git push || echo "push failed"
